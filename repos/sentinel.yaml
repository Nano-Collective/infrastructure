# Generated by scripts/import-from-live.sh. Phase A: this records what the
# organisation is today, including drift. Change it in a pull request.
name: sentinel
description: "Nanocoder-driven security & code audits across a GitHub org — configurable rule packs you own, findings filed as issues. Local-first, by the Nano Collective."
homepage: "https://docs.nanocollective.org/sentinel/docs"
visibility: public
archived: false
vulnerability_alerts: true
default_branch: main

topics:
  - code-audit
  - github-actions
  - local-first
  - nanocoder
  - sast
  - security
  - static-analysis
  - typescript

features:
  issues: true
  projects: true
  wiki: false
  discussions: false

merge:
  squash: true
  merge_commit: true
  rebase: true
  auto_merge: false
  delete_branch_on_merge: false

rulesets:
  quality:
    enforcement: active
  review:
    enforcement: active
    copilot_code_review: true

# Labels stay unmanaged until the existing set in this repo has been folded
# into org/labels.yaml. Flipping this on before that happens deletes the rest.
manage_labels: false

whitepaper: sentinel

# Organisation Actions secrets that must exist, by name only.
#
# No value appears in this file, in the state file, or anywhere else this repo
# can reach. An organisation owner sets each value by hand in the GitHub UI.
# All CI does is check that the name exists at the stated visibility and fail
# the build if it does not, so a secret that quietly disappears is caught the
# same day rather than when a release breaks.
#
# Managing values would put them in the state file, and a state file gets
# copied, cached and restored from backup.
#
# visibility: all | private | selected
#   'all' is what public repositories on the Free plan need.

required:
  - name: MINIMAX_API_KEY
    visibility: all
    used_by: nc-review, the automated reviewer in Nano-Collective/.github
    owner: core-team

  - name: CLOUDFLARE_API_TOKEN
    visibility: all
    used_by: Pages deployments in docs, organisation, nanolist, contentforest, branding
    owner: core-team

  - name: CLOUDFLARE_ACCOUNT_ID
    visibility: all
    used_by: Pages deployments, and the R2 state backend for this repo
    owner: core-team

  - name: NPM_TOKEN
    visibility: all
    used_by: release.yml in the published packages
    owner: core-team

  - name: DISCORD_WEBHOOK
    visibility: all
    used_by: release notifications
    owner: core-team
